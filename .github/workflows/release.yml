name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          path: moechat-macos

      - uses: actions/checkout@v4
        with:
          repository: moechat-ai/msglist
          path: msglist

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 构建子应用
        run: |
          cd msglist
          npm ci
          npm run build

      - name: 构建并打包
        run: |
          cd moechat-macos
          ./scripts/make-app.sh release

      # 未签名未公证，首次打开需要右键 →「打开」
      #
      # 产物落在 moechat-macos/ 里面，不在 $GITHUB_WORKSPACE 根上——
      # gh release create 需要 git 仓库上下文，而 workspace 根目录没有 .git
      # （两次 checkout 都在子目录里）。放进仓库目录，working-directory 指过去即可。
      - name: 压缩
        run: |
          cd moechat-macos/build
          zip -qry ../Moechat-${GITHUB_REF_NAME}-macos.zip Moechat.app
          cd ..
          shasum -a 256 Moechat-*.zip > SHA256SUMS

      - name: 发布
        working-directory: moechat-macos
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            Moechat-*.zip SHA256SUMS \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
