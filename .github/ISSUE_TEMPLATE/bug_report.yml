name: 缺陷报告
description: 有东西没按预期工作
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        请尽量给出**可复现的最短路径**。只贴结论、不贴步骤的报告很难定位。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 实际看到的现象。有报错就把原文贴全。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望是什么
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: release tag，或 commit sha
      placeholder: v0.0.1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 平台
      multiple: true
      options:
        - Android
        - macOS
        - Web（浏览器直接打开）
        - 其他
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 系统版本、设备型号、浏览器版本等
    validations:
      required: false
